<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 LifeOS: Crystal Power Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #FFF6FB, #F3E8FF, #EAF7FF);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-color: #444;
            --accent-color: #d46fb8;
            --border-color: #FFD7EE;
            --btn-grad: linear-gradient(90deg, #FFB6D9, #CDB4FF);
            --btn-hover: linear-gradient(90deg, #FFD56F, #FFB6D9);
        }

        .dark-mode {
            --bg-gradient: linear-gradient(135deg, #2d1b2d, #1a1a2e, #16213e);
            --card-bg: rgba(40, 40, 60, 0.85);
            --text-color: #f0f0f0;
            --accent-color: #ff9de2;
            --border-color: #4a3f52;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; padding: 20px; color: var(--text-color); transition: 0.3s; }
        
        h1 { text-align: center; font-size: 38px; color: var(--accent-color); text-shadow: 2px 2px white; margin-bottom: 5px;}
        #daily-affirmation { text-align: center; font-style: italic; color: #a67dc2; margin-bottom: 20px; font-weight: bold; }

        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            border: 3px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(255, 192, 203, .15);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); }

        button {
            padding: 10px 18px; border: none; border-radius: 50px; cursor: pointer;
            color: white; background: var(--btn-grad); font-weight: bold; transition: 0.3s;
        }
        button:hover { background: var(--btn-hover); transform: scale(1.05); }

        input, select, textarea { padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); outline: none; width: 100%; margin-bottom: 10px;}

        .item-row {
            background: white; padding: 10px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--accent-color);
        }

        /* SPOTIFY PORTAL STYLES */
        .spotify-crystal {
            margin-top: 10px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px double var(--border-color);
            box-shadow: 0 0 15px rgba(212, 111, 184, 0.2);
            background: #000;
        }
        #spotify-player { width: 100%; height: 380px; border: none; display: block; }

        /* LUNAR CALENDAR */
        .moon-display { text-align: center; padding: 15px; background: rgba(255,255,255,0.3); border-radius: 20px; }
        #moon-icon { font-size: 50px; display: block; filter: drop-shadow(0 0 10px gold); }

        /* MANA BAR */
        .mana-progress { width: 100%; height: 15px; background: #eee; border-radius: 50px; overflow: hidden; margin: 10px 0; }
        .mana-fill { height: 100%; width: 0%; background: #b4e4ff; transition: 0.5s; }

        /* OVERLAY */
        #meeting-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #ff9de2, #CDB4FF, #FFD56F);
            background-size: 400% 400%; animation: gradientBG 5s ease infinite;
            z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .del-btn { background: none; color: #ff78a7; font-size: 20px; cursor:pointer; border:none;}
        .timer { font-size: 40px; text-align: center; color: var(--accent-color); margin: 10px 0; }
        .gem { width: 35px; height: 35px; border-radius: 50% 50% 10% 10%; cursor: pointer; border: 2px solid white; display: inline-block; margin: 0 5px; }
        .selected { border: 3px solid gold; transform: scale(1.2); }
    </style>
</head>
<body oninput="saveData()">

    <h1>🌙 Crystal Power OS ✨</h1>
    <div id="daily-affirmation">"Trust in the magic of your own heart."</div>

    <div class="container">

        <!-- SPOTIFY PORTAL -->
        <div class="card">
            <h2>🎵 Guardian's Playlist</h2>
            <div class="spotify-crystal">
                <iframe id="spotify-player" src="https://open.spotify.com/embed/playlist/33EkgjUY2Pwbk6pzAKRX9q?utm_source=generator" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
            <input type="text" id="spotify-link" placeholder="Change playlist URL..." onchange="updateSpotify()" style="margin-top:10px; font-size: 0.7rem;">
        </div>

        <!-- LUNAR PHASE -->
        <div class="card">
            <h2>🌙 Lunar Phase</h2>
            <div class="moon-display">
                <span id="moon-icon">🌑</span>
                <p id="moon-phase-name">Calculating...</p>
                <small id="moon-power" style="color: #6a4c93; font-weight: bold;"></small>
            </div>
        </div>

        <!-- LUNA COMPANION -->
        <div class="card">
            <div style="text-align: center; background: rgba(205, 180, 255, 0.2); border-radius: 20px; padding: 10px; margin-bottom: 10px;">
                <span style="font-size: 40px; animation: float 3s infinite; display:block;">🐱</span>
                <p id="luna-tip" style="font-size: 0.8rem; font-weight: bold; color: #6a4c93;"></p>
            </div>
            <h2>💎 Soul Gem</h2>
            <div style="text-align: center;">
                <div class="gem" style="background:#ffb3c6;" onclick="setMood(this, 'Happy')"></div>
                <div class="gem" style="background:#b4e4ff;" onclick="setMood(this, 'Calm')"></div>
                <div class="gem" style="background:#ffd56f;" onclick="setMood(this, 'Energetic')"></div>
                <div class="gem" style="background:#a0a0a0;" onclick="setMood(this, 'Tired')"></div>
            </div>
        </div>

        <!-- QUEST SCROLL -->
        <div class="card" style="grid-row: span 2;">
            <h2>✅ Quest Scroll</h2>
            <input type="text" id="newTaskText" placeholder="New quest...">
            <div style="display:flex; gap:5px;">
                <input type="date" id="newTaskDate" style="flex:2;">
                <select id="newTaskPrio" style="flex:1;">
                    <option value="low">Low</option>
                    <option value="med" selected>Med</option>
                    <option value="high">High</option>
                </select>
            </div>
            <button onclick="addTask()" style="width:100%;">✨ Accept Quest</button>
            <div id="task-list" style="margin-top:15px;"></div>
            <div style="text-align:center; padding:10px; background:rgba(255,255,255,0.4); border-radius:20px;">
                <p>🌟 Star Seeds: <span id="star-count">0</span></p>
                <span id="rank-badge" style="font-size: 0.8rem; font-weight: bold;">Novice Guardian</span>
            </div>
        </div>

        <!-- MANA RESERVOIR -->
        <div class="card">
            <h2>💧 Mana (Water)</h2>
            <div class="mana-progress"><div id="mana-fill" class="mana-fill"></div></div>
            <div style="display:flex; justify-content: space-between; align-items:center;">
                <button onclick="addMana()">➕ Recharge</button>
                <span id="mana-text" style="font-size: 0.8rem;">0 / 2000ml</span>
            </div>
        </div>

        <!-- MEETINGS -->
        <div class="card">
            <h2>📅 Meetings</h2>
            <input type="text" id="mtgTitle" placeholder="Title">
            <div style="display:flex; gap:5px;">
                <input type="date" id="mtgDate">
                <input type="time" id="mtgTime">
            </div>
            <button onclick="addMeeting()" style="width:100%;">🎀 Schedule</button>
            <div id="meeting-list" style="margin-top:10px;"></div>
        </div>

        <!-- POMODORO -->
        <div class="card">
            <h2>⏰ Crystal Timer</h2>
            <div class="timer" id="timer-display">25:00</div>
            <div style="text-align:center; display:flex; gap:10px; justify-content:center;">
                <button onclick="toggleTimer()" id="timer-btn">Start</button>
                <button onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="card">
            <h2>⚙ Palace Controls</h2>
            <button onclick="toggleDarkMode()" style="width:100%; margin-bottom:10px;">🌙 Night Mode</button>
            <div style="display:flex; gap:5px;">
                <button onclick="downloadBackup()" style="flex:1;">💾 Backup</button>
                <button onclick="document.getElementById('restoreFile').click()" style="flex:1;">📖 Restore</button>
            </div>
            <input type="file" id="restoreFile" style="display:none" onchange="restoreBackup(event)">
            <button onclick="clearData()" style="width:100%; margin-top:10px; background:#ffb3c6;">🗑 Reset</button>
        </div>

    </div>

    <!-- NOTIFICATION OVERLAY -->
    <div id="meeting-alert-overlay">
        <h2 id="alert-heading" style="font-size: 3rem;">Crystal Power Alert!</h2>
        <p id="alert-text" style="font-size: 1.5rem; margin: 25px 0;"></p>
        <button onclick="closeAlert()" style="background:white; color:#d46fb8; padding: 15px 40px; font-size: 1.5rem; font-weight:bold;">Got it! 🌙</button>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" loop></audio>

    <script>
        let state = {
            meetings: [], tasks: [], starSeeds: 0, mana: 0,
            darkMode: false, currentMood: "", spotifyLink: "https://open.spotify.com/playlist/33EkgjUY2Pwbk6pzAKRX9q"
        };

        const lunaTips = ["🐱 \"This playlist has strong magical energy!\"", "🐱 \"A Guardian always drinks their mana.\"", "🐱 \"Check the moon phase before a quest!\""];

        function updateSpotify() {
            let link = document.getElementById('spotify-link').value;
            if(!link) return;
            let embedLink = link.split('?')[0].replace(".com/", ".com/embed/");
            document.getElementById('spotify-player').src = embedLink + "?utm_source=generator";
            state.spotifyLink = link;
            saveData();
        }

        function getMoonPhase() {
            const date = new Date();
            let y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
            if (m < 3) { y--; m += 12; }
            let jd = (365.25 * y) + (30.6 * m) + d - 694039.09;
            jd /= 29.5305882;
            let phase = Math.round((jd - parseInt(jd)) * 29);
            let res = {i: "🌕", n: "Full Moon", p: "Power: 100%"};
            if (phase <= 1 || phase >= 29) res = {i: "🌑", n: "New Moon", p: "Power: 10%"};
            else if (phase <= 7) res = {i: "🌒", n: "Waxing Crescent", p: "Power: 25%"};
            else if (phase <= 14) res = {i: "🌓", n: "First Quarter", p: "Power: 50%"};
            else if (phase <= 21) res = {i: "🌔", n: "Waxing Gibbous", p: "Power: 75%"};
            document.getElementById('moon-icon').innerText = res.i;
            document.getElementById('moon-phase-name').innerText = res.n;
            document.getElementById('moon-power').innerText = res.p;
        }

        function addTask() {
            const t = document.getElementById('newTaskText').value, d = document.getElementById('newTaskDate').value, p = document.getElementById('newTaskPrio').value;
            if(!t) return;
            state.tasks.push({id: Date.now(), t, d: d||"No date", p});
            document.getElementById('newTaskText').value=''; renderTasks(); saveData();
        }
        function renderTasks() {
            document.getElementById('task-list').innerHTML = state.tasks.map(x => `
                <div class="item-row" style="border-left-color: ${x.p === 'high' ? '#ff4d6d' : (x.p === 'med' ? '#ffb703' : '#2ec4b6')}">
                    <span><b>${x.t}</b><br><small>${x.d}</small></span>
                    <button class="del-btn" onclick="completeTask(${x.id})">🌟</button>
                </div>
            `).join('');
            document.getElementById('star-count').innerText = state.starSeeds;
            let r = "Guardian"; if(state.starSeeds > 10) r = "Scout"; if(state.starSeeds > 30) r = "Moon Princess";
            document.getElementById('rank-badge').innerText = r;
        }
        function completeTask(id) { state.tasks = state.tasks.filter(x => x.id !== id); state.starSeeds++; renderTasks(); saveData(); }

        function addMeeting() {
            const t=document.getElementById('mtgTitle').value, d=document.getElementById('mtgDate').value, tm=document.getElementById('mtgTime').value;
            if(t&&d&&tm){ state.meetings.push({id:Date.now(), t, d, tm, n15:false, nS:false}); renderMeetings(); saveData(); }
        }
        function renderMeetings() { document.getElementById('meeting-list').innerHTML = state.meetings.map(m=>`<div class="item-row"><span><b>${m.t}</b><br><small>${m.d} @ ${m.tm}</small></span><button class="del-btn" onclick="deleteMtg(${m.id})">×</button></div>`).join(''); }
        function deleteMtg(id) { state.meetings = state.meetings.filter(x=>x.id!==id); renderMeetings(); saveData(); }

        setInterval(() => {
            const n = new Date();
            state.meetings.forEach(m => {
                const md = new Date(`${m.d}T${m.tm}`); const diff = (md - n)/1000/60;
                if(diff <= 15 && diff > 14 && !m.n15) { triggerAlert("Warning!", m.t + " starts in 15m"); m.n15=true; saveData(); }
                if(diff <= 0 && diff > -1 && !m.nS) { triggerAlert("Alert!", m.t + " starts now!"); m.nS=true; saveData(); }
            });
        }, 10000);

        function triggerAlert(h, t) { document.getElementById('alert-heading').innerText=h; document.getElementById('alert-text').innerText=t; document.getElementById('meeting-alert-overlay').style.display='flex'; document.getElementById('notif-sound').play(); }
        function closeAlert() { document.getElementById('meeting-alert-overlay').style.display='none'; document.getElementById('notif-sound').pause(); }
        
        function addMana() { state.mana = Math.min(2000, state.mana + 250); updateMana(); saveData(); }
        function updateMana() { document.getElementById('mana-fill').style.width = (state.mana/2000)*100 + "%"; document.getElementById('mana-text').innerText = state.mana + " / 2000ml"; }
        function setMood(el, mood) { document.querySelectorAll('.gem').forEach(g=>g.classList.remove('selected')); el.classList.add('selected'); state.currentMood = mood; saveData(); }
        function saveData() { localStorage.setItem('lifeOS_final_v1', JSON.stringify(state)); }
        function loadData() {
            const saved = localStorage.getItem('lifeOS_final_v1');
            if(saved) state = JSON.parse(saved);
            getMoonPhase(); renderTasks(); renderMeetings(); updateMana();
            if(state.spotifyLink) { document.getElementById('spotify-link').value = state.spotifyLink; updateSpotify(); }
            document.getElementById('luna-tip').innerText = lunaTips[Math.floor(Math.random()*lunaTips.length)];
            if(state.darkMode) document.body.classList.add('dark-mode');
        }

        function downloadBackup() { const s = localStorage.getItem('lifeOS_final_v1'); const b = new Blob([s], {type: 'text/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'lifeos_backup.json'; a.click(); }
        function restoreBackup(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload = (x) => { localStorage.setItem('lifeOS_final_v1', x.target.result); location.reload(); }; r.readAsText(f); }
        function toggleDarkMode() { state.darkMode = document.body.classList.toggle('dark-mode'); saveData(); }
        function clearData() { if(confirm("Clear Palace?")) { localStorage.clear(); location.reload(); } }

        let tSecs = 1500, tInt = null;
        function toggleTimer() { const b = document.getElementById('timer-btn'); if(tInt) { clearInterval(tInt); tInt=null; b.innerText="Start"; } else { b.innerText="Pause"; tInt = setInterval(() => { tSecs--; const m = Math.floor(tSecs/60), s = tSecs%60; document.getElementById('timer-display').innerText = `${m}:${s.toString().padStart(2,'0')}`; if(tSecs <= 0) { clearInterval(tInt); document.getElementById('notif-sound').play(); alert("Break!"); } }, 1000); } }
        function resetTimer() { clearInterval(tInt); tInt=null; tSecs=1500; document.getElementById('timer-display').innerText="25:00"; }

        window.onload = loadData;
    </script>
</body>
</html>
