<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 LifeOS: Crystal Power Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #fce4ec, #f3e5f5, #e1f5fe);
            --card-bg: rgba(255, 255, 255, 0.6);
            --accent-color: #d46fb8;
            --btn-grad: linear-gradient(90deg, #ffb6d9, #cdb4ff);
            --moon-yellow: #fff176;
        }

        .dark-mode {
            --bg-gradient: linear-gradient(135deg, #2d1b2d, #1a1a2e, #16213e);
            --card-bg: rgba(40, 40, 60, 0.7);
            --accent-color: #ff9de2;
        }

        /* --- THE MAGIC MOON CURSOR (Directly Embedded) --- */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path fill="%23fff176" d="M16 2s-1 5-6 6 5 6 6 6-1 5 6 6-5-6-6-6 5-6-6-6zm-4 13a7 7 0 1 0 0-14 9 9 0 0 1 0 14z"/></svg>'), auto !important;
        }

        body { 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            padding: 20px; 
            color: #444; 
            transition: 0.3s;
            background-attachment: fixed;
            position: relative;
        }

        /* Floating Sparkle Background */
        body::after {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }

        h1 { text-align: center; font-size: 38px; color: var(--accent-color); text-shadow: 2px 2px white; margin-bottom: 5px;}
        #daily-affirmation { text-align: center; font-style: italic; color: #a67dc2; margin-bottom: 25px; font-weight: bold; }

        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 22px;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 8px 32px rgba(255, 182, 217, 0.2);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }

        button {
            padding: 10px 18px; border: none; border-radius: 50px; 
            color: white; background: var(--btn-grad); font-weight: bold; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(205, 180, 255, 0.4);
        }
        button:hover { transform: scale(1.05); filter: brightness(1.1); color: #5e35b1;}

        input, select, textarea { padding: 10px; border-radius: 12px; border: 1px solid #ffebee; outline: none; width: 100%; margin-bottom: 10px; background: rgba(255,255,255,0.8);}

        .item-row {
            background: rgba(255,255,255,0.9); padding: 12px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--accent-color);
        }

        /* --- VITALITY HUB --- */
        .vitality-divider { border-top: 1px dashed #d1c4e9; margin: 15px 0; padding-top: 15px; }
        .mana-progress { width: 100%; height: 18px; background: #eee; border-radius: 50px; overflow: hidden; margin: 10px 0; }
        .mana-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #b4e4ff, #81d4fa); transition: 0.5s; }
        .mana-reset { font-size: 0.7rem; background: #ef9a9a; color: white; padding: 4px 10px; border-radius: 10px; border: none; }

        #rank-badge {
            display: inline-block; padding: 8px 20px; border-radius: 50px; 
            font-weight: bold; font-size: 0.9rem; color: white; margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2); transition: 0.5s;
            background: #ffb3c6; box-shadow: 0 0 10px #ffb3c6;
        }

        .spotify-crystal { border-radius: 20px; overflow: hidden; border: 3px solid #f8bbd0; background: #000; }
        #spotify-player { width: 100%; height: 280px; border: none; display: block; }

        .gem { width: 35px; height: 35px; border-radius: 50% 50% 10% 10%; border: 2px solid white; display: inline-block; margin: 0 5px; transition: 0.2s; }
        .selected { border: 3px solid gold; transform: scale(1.2) translateY(-5px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); }

        #meeting-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #ff9de2, #CDB4FF, #FFD56F);
            z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white;
        }
        
        .timer { font-size: 45px; text-align: center; color: var(--accent-color); margin: 10px 0; font-weight: bold; text-shadow: 1px 1px white;}
    </style>
</head>
<body oninput="saveData()">

    <h1>🌙 Crystal Power Palace ✨</h1>
    <div id="daily-affirmation">"The moon will always guide your magic."</div>

    <div class="container">

        <!-- 1. QUEST SCROLL (TOP) -->
        <div class="card" style="grid-row: span 2;">
            <h2>✅ Quest Scroll</h2>
            <div style="background: rgba(255,255,255,0.3); padding: 15px; border-radius: 20px; margin-bottom:15px;">
                <input type="text" id="newTaskText" placeholder="New quest name...">
                <div style="display:flex; gap:5px;">
                    <input type="date" id="newTaskDate" style="flex:1;">
                    <select id="newTaskPrio">
                        <option value="low">Low</option>
                        <option value="med" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <button onclick="addTask()" style="width:100%;">✨ Add Quest</button>
            </div>
            <div id="task-list"></div>
            
            <div style="text-align:center; padding:15px; background:rgba(255,255,255,0.4); border-radius:25px; margin-top:10px;">
                <p style="font-weight: bold; color: #9575cd;">🌟 Star Seeds: <span id="star-count">0</span></p>
                <span id="rank-badge">Novice Guardian</span>
            </div>
        </div>

        <!-- 2. MEETINGS (TOP) -->
        <div class="card">
            <h2>📅 Crystal Meetings</h2>
            <input type="text" id="mtgTitle" placeholder="Meeting purpose...">
            <div style="display:flex; gap:5px;">
                <input type="date" id="mtgDate" style="flex:1;">
                <input type="time" id="mtgTime" style="flex:1;">
            </div>
            <button onclick="addMeeting()" style="width:100%;">🎀 Schedule Reminder</button>
            <div id="meeting-list" style="margin-top:15px;"></div>
        </div>

        <!-- 3. MAGICAL VITALITY HUB -->
        <div class="card">
            <h2>💖 Magical Vitality</h2>
            
            <!-- Mana -->
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size: 0.9rem; font-weight:bold;">💧 Mana Reservoir</span>
                <button class="mana-reset" onclick="resetMana()">Reset 🧹</button>
            </div>
            <div class="mana-progress"><div id="mana-fill" class="mana-fill"></div></div>
            <div style="display:flex; justify-content: space-between; align-items:center;">
                <button onclick="addMana()" style="padding: 5px 12px; font-size: 0.75rem;">➕ Drink 250ml</button>
                <span id="mana-text" style="font-size: 0.8rem; font-weight:bold;">0 / 2000ml</span>
            </div>

            <div class="vitality-divider"></div>

            <!-- Moon & Soul Gem -->
            <div style="display:flex; justify-content:space-around; align-items:center;">
                <div style="text-align:center;">
                    <span id="moon-icon" style="font-size: 40px; display:block;">🌑</span>
                    <small id="moon-phase-name" style="font-weight:bold; color:var(--accent-color);"></small>
                </div>
                <div style="text-align:center;">
                    <div class="gem" style="background:#ffb3c6;" onclick="setMood(this, 'Happy')"></div>
                    <div class="gem" style="background:#b4e4ff;" onclick="setMood(this, 'Calm')"></div>
                    <div class="gem" style="background:#ffd56f;" onclick="setMood(this, 'Energetic')"></div>
                    <div class="gem" style="background:#a0a0a0;" onclick="setMood(this, 'Tired')"></div>
                </div>
            </div>
        </div>

        <!-- 4. SPOTIFY -->
        <div class="card">
            <h2>🎵 Guardian's Theme</h2>
            <div class="spotify-crystal">
                <iframe id="spotify-player" src="https://open.spotify.com/embed/playlist/33EkgjUY2Pwbk6pzAKRX9q?utm_source=generator" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </div>

        <!-- 5. TIMER & SETTINGS -->
        <div class="card">
            <h2>⏰ Crystal Timer</h2>
            <div class="timer" id="timer-display">25:00</div>
            <div style="text-align:center; display:flex; gap:10px; justify-content:center; margin-bottom:15px;">
                <button onclick="toggleTimer()" id="timer-btn">Start Focus</button>
                <button onclick="resetTimer()" style="background:#cfd8dc; color:#546e7a;">Reset</button>
            </div>

            <div class="vitality-divider"></div>

            <h2>⚙ Palace Controls</h2>
            <button onclick="toggleDarkMode()" style="width:100%; margin-bottom:10px;">🌙 Night Mode</button>
            <div style="display:flex; gap:8px;">
                <button onclick="downloadBackup()" style="flex:1; background:#CDB4FF;">💾 Backup</button>
                <button onclick="document.getElementById('restoreFile').click()" style="flex:1; background:#FFB6D9;">📖 Restore</button>
            </div>
            <input type="file" id="restoreFile" style="display:none" onchange="restoreBackup(event)">
            <button onclick="clearData()" style="width:100%; margin-top:10px; background:#ffcdd2; color:#b71c1c;">🗑 Reset Palace</button>
        </div>

    </div>

    <!-- NOTIFICATION OVERLAY -->
    <div id="meeting-alert-overlay">
        <h2 id="alert-heading" style="font-size: 3rem; text-shadow: 0 0 15px white;">Crystal Power Alert!</h2>
        <p id="alert-text" style="font-size: 1.5rem; margin: 25px 0; font-weight: bold;"></p>
        <button onclick="closeAlert()" style="background:white; color:#d46fb8; padding: 18px 50px; font-size: 1.4rem; font-weight:bold;">I'm Ready! 🌙</button>
    </div>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" loop></audio>

    <script>
        let state = { meetings: [], tasks: [], starSeeds: 0, mana: 0, darkMode: false, currentMood: "" };

        function resetMana() { state.mana = 0; updateMana(); saveData(); }
        
        function updateRank() {
            let rank = "Novice Guardian", color = "#ffb3c6";
            if (state.starSeeds >= 10) { rank = "Crystal Scout"; color = "#b4e4ff"; }
            if (state.starSeeds >= 30) { rank = "Star Knight"; color = "#ffd56f"; }
            if (state.starSeeds >= 50) { rank = "Moon Princess"; color = "#cdb4ff"; }
            const badge = document.getElementById('rank-badge');
            badge.innerText = rank; badge.style.backgroundColor = color; badge.style.boxShadow = `0 0 15px ${color}`;
        }

        function addTask() {
            const t = document.getElementById('newTaskText').value, d = document.getElementById('newTaskDate').value, p = document.getElementById('newTaskPrio').value;
            if(!t) return;
            state.tasks.push({ id: Date.now(), text: t, date: d || "No date", prio: p });
            renderTasks(); saveData();
            document.getElementById('newTaskText').value = '';
        }
        function renderTasks() {
            document.getElementById('task-list').innerHTML = state.tasks.map(t => `
                <div class="item-row" style="border-left-color: ${t.prio === 'high' ? '#ff4d6d' : (t.prio === 'med' ? '#ffb703' : '#2ec4b6')}">
                    <span><b>${t.text}</b><br><small>📅 ${t.date}</small></span>
                    <button class="del-btn" onclick="completeQuest(${t.id})" style="background:none; border:none; color:gold;">🌟</button>
                </div>
            `).join('');
            document.getElementById('star-count').innerText = state.starSeeds;
            updateRank();
        }
        function completeQuest(id) { state.tasks = state.tasks.filter(t => t.id !== id); state.starSeeds += 1; renderTasks(); saveData(); }

        function getMoonPhase() {
            const date = new Date();
            let y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
            if (m < 3) { y--; m += 12; }
            let jd = (365.25 * y) + (30.6 * m) + d - 694039.09;
            let phase = Math.round(((jd / 29.5305882) - parseInt(jd / 29.5305882)) * 29);
            let res = {i: "🌕", n: "Full Moon", p: "100% Power"};
            if (phase <= 1 || phase >= 29) res = {i: "🌑", n: "New Moon", p: "10% Power"};
            else if (phase <= 7) res = {i: "🌒", n: "Waxing Crescent", p: "25% Power"};
            else if (phase <= 14) res = {i: "🌓", n: "First Quarter", p: "50% Power"};
            else if (phase <= 21) res = {i: "🌔", n: "Waxing Gibbous", p: "75% Power"};
            document.getElementById('moon-icon').innerText = res.i;
            document.getElementById('moon-phase-name').innerText = res.n;
            document.getElementById('moon-power').innerText = res.p;
        }

        function addMeeting() {
            const t=document.getElementById('mtgTitle').value, d=document.getElementById('mtgDate').value, tm=document.getElementById('mtgTime').value;
            if(t&&d&&tm){ state.meetings.push({id:Date.now(), t, d, tm, n15:false, nS:false}); renderMeetings(); saveData(); }
        }
        function renderMeetings() { document.getElementById('meeting-list').innerHTML = state.meetings.map(m=>`<div class="item-row"><span><b>${m.t}</b><br><small>${m.d} @ ${m.tm}</small></span><button onclick="deleteMtg(${m.id})" style="background:none; border:none; color:red;">×</button></div>`).join(''); }
        function deleteMtg(id) { state.meetings = state.meetings.filter(x=>x.id!==id); renderMeetings(); saveData(); }

        setInterval(() => {
            const n = new Date();
            state.meetings.forEach(m => {
                const md = new Date(`${m.d}T${m.tm}`); const diff = (md - n)/1000/60;
                if(diff <= 15 && diff > 14 && !m.n15) { triggerAlert("Warning!", `"${m.t}" starts in 15m!`); m.n15=true; saveData(); }
                if(diff <= 0 && diff > -1 && !m.nS) { triggerAlert("Alert!", `"${m.t}" starts now! ✨`); m.nS=true; saveData(); }
            });
        }, 10000);

        function triggerAlert(h, t) { document.getElementById('alert-heading').innerText=h; document.getElementById('alert-text').innerText=t; document.getElementById('meeting-alert-overlay').style.display='flex'; document.getElementById('notif-sound').play(); }
        function closeAlert() { document.getElementById('meeting-alert-overlay').style.display='none'; document.getElementById('notif-sound').pause(); document.getElementById('notif-sound').currentTime = 0; }
        function addMana() { state.mana = Math.min(2000, state.mana + 250); updateMana(); saveData(); }
        function updateMana() { document.getElementById('mana-fill').style.width = (state.mana/2000)*100 + "%"; document.getElementById('mana-text').innerText = state.mana + " / 2000ml"; }
        function setMood(el, mood) { document.querySelectorAll('.gem').forEach(g=>g.classList.remove('selected')); el.classList.add('selected'); state.currentMood = mood; saveData(); }
        function saveData() { localStorage.setItem('lifeOS_final_vFinal', JSON.stringify(state)); }
        function loadData() {
            const saved = localStorage.getItem('lifeOS_final_vFinal');
            if(saved) state = JSON.parse(saved);
            getMoonPhase(); renderTasks(); renderMeetings(); updateMana();
            if(state.darkMode) document.body.classList.add('dark-mode');
        }
        function downloadBackup() { const s = localStorage.getItem('lifeOS_final_vFinal'); const b = new Blob([s], {type: 'text/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'lifeos_backup.json'; a.click(); }
        function restoreBackup(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload = (x) => { localStorage.setItem('lifeOS_final_vFinal', x.target.result); location.reload(); }; r.readAsText(f); }
        function toggleDarkMode() { state.darkMode = document.body.classList.toggle('dark-mode'); saveData(); }
        function clearData() { if(confirm("Clear all Palace memories?")) { localStorage.clear(); location.reload(); } }

        let tSecs = 1500, tInt = null;
        function toggleTimer() { const b = document.getElementById('timer-btn'); if(tInt) { clearInterval(tInt); tInt=null; b.innerText="Start Focus"; } else { b.innerText="Pause"; tInt = setInterval(() => { tSecs--; const m = Math.floor(tSecs/60), s = tSecs%60; document.getElementById('timer-display').innerText = `${m}:${s.toString().padStart(2,'0')}`; if(tSecs <= 0) { clearInterval(tInt); document.getElementById('notif-sound').play(); alert("Break!"); } }, 1000); } }
        function resetTimer() { clearInterval(tInt); tInt=null; tSecs=1500; document.getElementById('timer-display').innerText="25:00"; }
        window.onload = loadData;
    </script>
</body>
</html>
